<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>eHotels Demo</title>
</head>
<body>
<h1>eHotels Demo</h1>

<button onclick="loadHotelChains()">Load Hotel Chains</button>

<ul id="hotelChainList"></ul>

<script>
    async function loadHotelChains() {
        const response = await fetch('/hotel-chains');
        const hotelChains = await response.json();

        const list = document.getElementById('hotelChainList');
        list.innerHTML = '';

        hotelChains.forEach(chain => {
            const li = document.createElement('li');
            li.textContent = `${chain.chainName} - ${chain.streetName} ${chain.buildingNumber}, ${chain.postalCode}`;
            list.appendChild(li);
        });
    }
</script>
</body>
</html>
