<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>e-Hotels</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 60px 40px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #444;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .choice-button {
            display: inline-block;
            padding: 14px 24px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            min-width: 180px;
        }

        .choice-button:hover {
            background: #163a59;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>e-Hotels</h1>
    <p>Please choose how you want to use the application.</p>

    <div class="button-group">
        <a class="choice-button" href="/customer.html">Customer</a>
        <a class="choice-button" href="/employee.html">Employee</a>
        <a class="choice-button" href="/manager.html" style="background: #791f1f;">Manager Portal</a>
    </div>
</div>

</body>
</html>
