<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Portal - e-Hotels</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 40px; }
        .top-link { display: inline-block; margin-bottom: 18px; text-decoration: none; color: #1f4e79; font-size: 14px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; margin-bottom: 20px; color: #1f4e79; }
        h2 { margin-top: 0; margin-bottom: 14px; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .section { margin-top: 30px; padding: 20px; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-weight: bold; font-size: 13px; color: #555; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; background: #1f4e79; color: white; cursor: pointer; font-size: 14px; }
        button.danger { background: #a33a3a; }

        /* Message Banner */
        .message { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; font-weight: bold; }
        .success { background: #edf8ef; color: #22643a; border: 1px solid #c3e6cb; }
        .error { background: #fdeeee; color: #a33a3a; border: 1px solid #f5c6cb; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f8f9fa; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; }
    </style>
</head>
<body>

<a class="top-link" href="/index.html">← Back to home</a>

<div class="container">
    <h1>Manager Administration Portal</h1>

    <div id="statusMsg" class="message"></div>

    <div id="authSection" class="section">
        <h2>Manager Verification</h2>
        <div class="field" style="max-width: 300px;">
            <label>Manager SSN</label>
            <input type="password" id="managerSsn" placeholder="9-digit SSN">
            <button id="verifyBtn" style="margin-top:12px;">Login</button>
        </div>
    </div>

    <div id="mainPortal" style="display:none;">
        <div class="section">
            <h2 id="hotelHeader">Hotel Information</h2>
            <div class="form-grid">
                <div class="field"><label>Hotel Name</label><input type="text" id="h_name"></div>
                <div class="field"><label>Rating (1-5)</label><input type="number" id="h_rating" min="1" max="5"></div>
                <div class="field"><label>Street Name</label><input type="text" id="h_street"></div>
                <div class="field"><label>Street number</label><input type="number" id="h_num"></div>
                <div class="field"><label>Postal Code</label><input type="text" id="h_postal"></div>
                <div class="field"><label>Emails (comma sep)</label><input type="text" id="h_emails"></div>
            </div>
            <button id="updateHotelBtn">Save Hotel Info</button>
        </div>

        <div class="section">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Employee Management</h2>
                <button id="openAddEmployeeModal">Add New Employee</button>
            </div>
            <table>
                <thead><tr><th>SSN</th><th>Full Name</th><th>Street number</th><th>Action</th></tr></thead>
                <tbody id="empTableBody"></tbody>
            </table>
        </div>

        <div class="section">
            <h2>Customer Directory</h2>
            <table>
                <thead><tr><th>License</th><th>Name</th><th>Action</th></tr></thead>
                <tbody id="custTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="employeeModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Employee Profile</h2>
        <div class="form-grid">
            <div class="field"><label>SSN (9 digits)</label><input type="text" id="e_ssn"></div>
            <div class="field"><label>First Name</label><input type="text" id="e_first"></div>
            <div class="field"><label>Middle Name</label><input type="text" id="e_middle"></div>
            <div class="field"><label>Last Name</label><input type="text" id="e_last"></div>
            <div class="field"><label>Street Name</label><input type="text" id="e_street"></div>
            <div class="field"><label>Street number</label><input type="number" id="e_num"></div>
            <div class="field"><label>Postal Code</label><input type="text" id="e_postal"></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button id="saveEmployeeBtn">Save Employee</button>
            <button onclick="closeModal()" style="background:#666;">Cancel</button>
        </div>
    </div>
</div>

<script>
    let activeHotel = null;
    const msgBox = document.getElementById('statusMsg');

    function notify(text, type) {
        msgBox.innerText = text;
        msgBox.className = "message " + type;
        msgBox.style.display = "block";
        window.scrollTo(0,0);
    }

    // LOGIN
    document.getElementById('verifyBtn').onclick = async () => {
        const ssn = document.getElementById('managerSsn').value.trim();
        const res = await fetch(`/api/manager/login?ssn=${encodeURIComponent(ssn)}`);
        if (res.ok) {
            activeHotel = await res.json();
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mainPortal').style.display = 'block';
            loadHotelData(); loadEmployees(); loadCustomers();
            notify("Access Granted", "success");
        } else { notify("Access Denied: 9-digit Manager SSN required.", "error"); }
    };

    function loadHotelData() {
        document.getElementById('h_name').value = activeHotel.hotelName || "";
        document.getElementById('h_rating').value = activeHotel.rating || "";
        document.getElementById('h_street').value = activeHotel.streetName || "";
        document.getElementById('h_num').value = activeHotel.streetNumber || "";
        document.getElementById('h_postal').value = activeHotel.postalCode || "";
        document.getElementById('h_emails').value = (activeHotel.emailAddresses || []).join(', ');
    }

    // HOTEL SAVE
    document.getElementById('updateHotelBtn').onclick = async () => {
        const rating = parseInt(document.getElementById('h_rating').value);
        if (isNaN(rating) || rating < 1 || rating > 5) {
            notify("Error: Rating must be between 1 and 5.", "error");
            return;
        }

        const updated = { ...activeHotel,
            hotelName: document.getElementById('h_name').value,
            rating: rating,
            streetName: document.getElementById('h_street').value,
            streetNumber: document.getElementById('h_num').value,
            postalCode: document.getElementById('h_postal').value,
            emailAddresses: document.getElementById('h_emails').value.split(',').map(s => s.trim()).filter(s => s !== "")
        };

        const res = await fetch('/api/manager/hotel/update', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(updated)
        });
        if(res.ok) notify("Hotel info saved!", "success");
        else notify("Update failed. Check SSN and Rating constraints.", "error");
    };

    // EMPLOYEE LOAD
    async function loadEmployees() {
        const res = await fetch(`/api/manager/employees?hotelId=${activeHotel.hotelId}`);
        const list = await res.json();
        document.getElementById('empTableBody').innerHTML = list.map(e => `
            <tr>
                <td>${e.ssn}</td>
                <td>${e.firstName} ${e.lastName}</td>
                <td>${e.streetNumber}</td>
                <td><button onclick='editEmp(${JSON.stringify(e)})'>Edit</button></td>
            </tr>`).join('');
    }

    // CUSTOMER LOAD
    async function loadCustomers() {
        const res = await fetch('/api/manager/customers');
        const list = await res.json();
        document.getElementById('custTableBody').innerHTML = list.map(c => `
            <tr>
                <td>${c.drivingLicenseNumber}</td>
                <td>${c.firstName} ${c.lastName}</td>
                <td><button class="danger" onclick="deleteCust('${c.drivingLicenseNumber}')">Delete</button></td>
            </tr>`).join('');
    }

    // SAVE EMPLOYEE
    async function saveEmployee() {
        const emp = {
            ssn: document.getElementById('e_ssn').value.trim(),
            firstName: document.getElementById('e_first').value.trim(),
            lastName: document.getElementById('e_last').value.trim(),
            streetName: document.getElementById('e_street').value.trim(),
            streetNumber: document.getElementById('e_num').value.trim(),
            postalCode: document.getElementById('e_postal').value.trim()
        };

        // UI Validation
        if(!/^\d{9}$/.test(emp.ssn)) return notify("SSN must be exactly 9 digits.", "error");
        if(!emp.firstName || !emp.lastName || !emp.streetNumber) return notify("All fields are required.", "error");

        const res = await fetch(`/api/manager/employee/save?hotelId=${activeHotel.hotelId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(emp)
        });

        if(res.ok) { notify("Employee saved!", "success"); closeModal(); loadEmployees(); }
        else { notify("Database Error: " + await res.text(), "error"); }
    }

    async function deleteCust(lic) {
        if(!confirm("Delete this customer profile?")) return;
        const res = await fetch(`/api/manager/customer/delete?license=${lic}`, { method: 'DELETE' });
        if(res.ok) { notify("Customer removed.", "success"); loadCustomers(); }
        else { notify("Error: Active bookings exist for this customer.", "error"); }
    }

    function editEmp(e) {
        document.getElementById('e_ssn').value = e.ssn; document.getElementById('e_ssn').disabled = true;
        document.getElementById('e_first').value = e.firstName; document.getElementById('e_last').value = e.lastName;
        document.getElementById('e_street').value = e.streetName; document.getElementById('e_num').value = e.streetNumber;
        document.getElementById('e_postal').value = e.postalCode;
        openModal();
    }

    document.getElementById('openAddEmployeeModal').onclick = () => {
        document.getElementById('e_ssn').disabled = false; document.getElementById('e_ssn').value = "";
        document.getElementById('e_first').value = ""; document.getElementById('e_last').value = "";
        openModal();
    };

    function openModal() { document.getElementById('employeeModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('employeeModal').style.display = 'none'; }
    document.getElementById('saveEmployeeBtn').onclick = saveEmployee;
</script>
</body>
</html>
